spring.application.name=exe-web-api
spring.profiles.default=local
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.auth.google.enabled=${GOOGLE_ENABLED:false}
app.auth.bootstrap-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.auth.bootstrap-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.proxy.required=false
app.proxy.secret=${ORIGIN_PROXY_SECRET:}
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/api
