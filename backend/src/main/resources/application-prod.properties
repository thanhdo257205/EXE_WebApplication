spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
# Release idle PostgreSQL backends after 60s (housekeeping can add up to 30s).
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
# JWT requests do not need persisted login sessions; retain JDBC for OAuth state.
# Expiry is checked on access; this only delays deletion of expired rows.
spring.session.jdbc.cleanup-cron=0 */15 * * * *
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
app.proxy.required=true
app.auth.jwt.required=true
app.auth.password-reset.public-origin=${PASSWORD_RESET_PUBLIC_ORIGIN:https://exe-webapp.pages.dev}
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
