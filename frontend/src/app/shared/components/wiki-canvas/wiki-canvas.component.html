<div class="wiki-canvas-card">
  <!-- Sub-header metadata line -->
  <div class="canvas-header">
    <span class="left-tag">{{ versionTag() }}</span>
    <span class="right-tag">{{ subtitleTag() }}</span>
  </div>

  <!-- Projected Main Canvas Content -->
  <div class="canvas-body">
    <ng-content></ng-content>
  </div>

  <!-- Canvas Footer Notice -->
  <div class="canvas-footer">
    <span>Nhà Này Hơi Báo! Wiki • Chưa Giàu Đã Lớn</span>
    <span class="prototype-label">BẢN THIẾT KẾ MẪU V2</span>
  </div>
</div>
