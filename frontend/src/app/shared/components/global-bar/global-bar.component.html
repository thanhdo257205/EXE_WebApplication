<header class="fixed top-0 left-0 right-0 md:left-16 h-12 bg-[#080c12] border-b border-[#1e2e3e] flex items-center justify-between px-4 md:px-6 z-20 select-none">
  <!-- Brand logo & Mobile menu trigger -->
  <div class="flex items-center gap-3">
    <button type="button"
            class="md:hidden text-slate-300 hover:text-white p-1 flex items-center justify-center focus:outline-none"
            (click)="menuToggle.emit()"
            [attr.aria-label]="isMobileMenuOpen() ? 'Đóng danh mục menu' : 'Mở danh mục menu'">
      <app-morph-icon
        [name]="isMobileMenuOpen() ? 'close' : 'menu'"
        [size]="22"
        color="currentColor"
        spring="bouncy"
      ></app-morph-icon>
    </button>

    <a routerLink="/" class="text-sm font-bold tracking-wider text-[#e6e6e6] hover:text-sky-300 transition-colors">
      NNHB / WIKI
    </a>
  </div>

  <!-- Search Input Box -->
  <div class="search-box hidden sm:flex items-center bg-[#18232f] border border-[#405367] rounded px-3 py-1 w-64 lg:w-80 text-xs text-slate-300 focus-within:border-sky-400">
    <app-morph-icon name="search" [size]="14" color="#94a3b8" class="mr-2 shrink-0"></app-morph-icon>
    <input type="text"
           placeholder="Tìm trong wiki..."
           class="bg-transparent border-none outline-none w-full text-slate-200 placeholder:text-slate-500">
  </div>

  <!-- Right side: Tag, Auth & Cart button -->
  <div class="flex items-center gap-3 text-xs font-medium">
    <span class="text-[#5ab2e7] tracking-wider hidden lg:inline">V2 / DEMO</span>

    @if (auth.currentUser(); as user) {
      @if (user.role === 'ADMIN') {
        <a routerLink="/admin" class="flex items-center gap-1.5 text-sky-400 hover:text-sky-300 bg-sky-950/60 border border-sky-800/60 px-2 py-1 rounded transition-colors font-bold" title="Bảng quản trị viên">
          <app-morph-icon name="shield" [size]="14" color="#38bdf8"></app-morph-icon>
          <span class="hidden md:inline">Quản trị</span>
        </a>
      }
      <div class="flex items-center gap-2 bg-[#141f2d] border border-[#233547] rounded px-2.5 py-1 text-slate-200">
        <app-morph-icon name="user" [size]="14" color="#38bdf8"></app-morph-icon>
        <span class="font-medium max-w-[100px] truncate">{{ user.displayName }}</span>
        <button type="button" (click)="logout()" class="text-slate-400 hover:text-rose-400 ml-1 text-xs" title="Đăng xuất">
          Thoát
        </button>
      </div>
    } @else {
      <a routerLink="/dang-nhap" class="flex items-center gap-1.5 text-slate-300 hover:text-sky-300 px-2 py-1 rounded transition-colors">
        <app-morph-icon name="user" [size]="15" color="currentColor"></app-morph-icon>
        <span class="hidden sm:inline">Đăng nhập</span>
      </a>
    }

    <a routerLink="/gio-hang" class="cart-btn flex items-center gap-2">
      <app-morph-icon name="cart" hoverName="store" [size]="18" color="#5ab2e7"></app-morph-icon>
      <span class="font-bold">Giỏ Hàng (2)</span>
    </a>
  </div>
</header>
