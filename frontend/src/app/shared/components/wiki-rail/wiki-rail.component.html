<aside aria-label="Thanh điều hướng bên"
       class="hidden md:flex fixed left-0 top-0 bottom-0 w-16 bg-[#080c12] border-r border-[#2a2d2f] flex-col items-center py-2 z-30 select-none">
  <!-- Top logo icon -->
  <a routerLink="/" class="w-12 h-12 flex items-center justify-center rounded text-[#dafa76] hover:bg-[#1a1d1f] transition-colors mb-2" title="Trang chủ">
    <app-morph-icon name="home" hoverName="story" [size]="24" color="#dafa76"></app-morph-icon>
  </a>

  <!-- Rail Navigation Items -->
  <nav class="flex flex-col gap-1 w-full px-1 text-center">
    @for (item of railItems; track item.link) {
      <a [routerLink]="item.link"
         routerLinkActive="active-rail"
         [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
         class="rail-btn group">
        <span class="mb-0.5 flex items-center justify-center">
          <app-morph-icon
            [name]="item.icon"
            [hoverName]="item.hoverIcon"
            [size]="18"
            color="currentColor"
            spring="bouncy"
          ></app-morph-icon>
        </span>
        <span class="label">{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
