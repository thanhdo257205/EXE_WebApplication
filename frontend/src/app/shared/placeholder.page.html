<app-page-hero [heading]="heading()" [description]="description()" [eyebrow]="section()" [tone]="tone()">
  <dl class="meta">
    <div><dt>Khu vực</dt><dd>{{ section() }}</dd></div>
    <div><dt>Trạng thái</dt><dd>{{ notFound() ? 'Không có trang này' : 'Đang biên soạn' }}</dd></div>
  </dl>
</app-page-hero>

<section class="block explore" aria-labelledby="explore-title">
  <div class="explore-head"><div><p class="eyebrow">{{ notFound() ? 'Đi đường khác' : 'Trong lúc chờ' }}</p><h2 id="explore-title" class="display">Ghé phòng<br>khác trong nhà.</h2></div><a routerLink="/" class="kit-pill ghost">Về trang chủ <span class="kit-arrow" aria-hidden="true">→</span></a></div>
  <app-explore-cards [count]="4" />
</section>
