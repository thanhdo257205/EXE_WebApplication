<a class="skip-link" href="#main">Chuyển đến nội dung</a>

<div class="app-container">
  <!-- Background Vector Artwork -->
  <div class="artwork-bg"></div>

  <!-- Shared Left Compact Wiki Rail (Sidebar) -->
  <app-wiki-rail></app-wiki-rail>

  <!-- Shared Top Global Wiki Bar -->
  <app-global-bar (menuToggle)="toggleMobileMenu()"></app-global-bar>

  <!-- Mobile Drawer Menu -->
  @if (mobileMenuOpen()) {
    <div class="mobile-overlay md:hidden" (click)="toggleMobileMenu()"></div>
    <nav class="mobile-drawer md:hidden" aria-label="Menu di động">
      <a routerLink="/" (click)="toggleMobileMenu()" class="drawer-link">Trang chủ</a>
      <a routerLink="/cau-chuyen" (click)="toggleMobileMenu()" class="drawer-link">Câu chuyện</a>
      <a routerLink="/cu-dan" (click)="toggleMobileMenu()" class="drawer-link">Cư dân (8 người)</a>
      <a routerLink="/cach-choi" (click)="toggleMobileMenu()" class="drawer-link">Cách chơi</a>
      <a routerLink="/wiki" (click)="toggleMobileMenu()" class="drawer-link">Wiki luật</a>
      <a routerLink="/thu-vien" (click)="toggleMobileMenu()" class="drawer-link">Thư viện thẻ (148 thẻ)</a>
      <a routerLink="/quy-nha" (click)="toggleMobileMenu()" class="drawer-link">Mô phỏng Quỹ nhà</a>
      <a routerLink="/cua-hang" (click)="toggleMobileMenu()" class="drawer-link">Cửa hàng board game</a>
      <a routerLink="/gio-hang" (click)="toggleMobileMenu()" class="drawer-link">Giỏ hàng & Thanh toán</a>
    </nav>
  }

  <!-- Main Content View Area -->
  <main id="main" tabindex="-1" class="main-content">
    <router-outlet />
  </main>
</div>
