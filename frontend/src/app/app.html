<a class="skip-link" href="#main">Chuyển đến nội dung</a>

<div class="app-container">
  <!-- Background Vector Artwork -->
  <div class="artwork-bg"></div>

  <!-- Shared Left Compact Wiki Rail (Sidebar) -->
  <app-wiki-rail></app-wiki-rail>

  <!-- Shared Top Global Wiki Bar -->
  <app-global-bar
    [isMobileMenuOpen]="mobileMenuOpen()"
    (menuToggle)="toggleMobileMenu()"
  ></app-global-bar>

  <!-- Mobile Drawer Menu -->
  @if (mobileMenuOpen()) {
    <div class="mobile-overlay md:hidden" (click)="toggleMobileMenu()"></div>
    <nav class="mobile-drawer md:hidden" aria-label="Menu di động">
      <a routerLink="/" (click)="toggleMobileMenu()" class="drawer-link flex items-center gap-3">
        <app-morph-icon name="home" [size]="18" color="#38bdf8"></app-morph-icon>
        <span>Trang chủ</span>
      </a>
      <a routerLink="/cau-chuyen" (click)="toggleMobileMenu()" class="drawer-link flex items-center gap-3">
        <app-morph-icon name="story" [size]="18" color="#38bdf8"></app-morph-icon>
        <span>Câu chuyện</span>
      </a>
      <a routerLink="/cu-dan" (click)="toggleMobileMenu()" class="drawer-link flex items-center gap-3">
        <app-morph-icon name="residents" [size]="18" color="#38bdf8"></app-morph-icon>
        <span>Cư dân (8 người)</span>
      </a>
      <a routerLink="/cach-choi" (click)="toggleMobileMenu()" class="drawer-link flex items-center gap-3">
        <app-morph-icon name="gameplay" [size]="18" color="#38bdf8"></app-morph-icon>
        <span>Cách chơi</span>
      </a>
      <a routerLink="/wiki" (click)="toggleMobileMenu()" class="drawer-link flex items-center gap-3">
        <app-morph-icon name="rules" [size]="18" color="#38bdf8"></app-morph-icon>
        <span>Wiki luật</span>
      </a>
      <a routerLink="/thu-vien" (click)="toggleMobileMenu()" class="drawer-link flex items-center gap-3">
        <app-morph-icon name="cards" [size]="18" color="#38bdf8"></app-morph-icon>
        <span>Thư viện thẻ (148 thẻ)</span>
      </a>
      <a routerLink="/quy-nha" (click)="toggleMobileMenu()" class="drawer-link flex items-center gap-3">
        <app-morph-icon name="fund" [size]="18" color="#38bdf8"></app-morph-icon>
        <span>Mô phỏng Quỹ nhà</span>
      </a>
      <a routerLink="/cua-hang" (click)="toggleMobileMenu()" class="drawer-link flex items-center gap-3">
        <app-morph-icon name="store" [size]="18" color="#38bdf8"></app-morph-icon>
        <span>Cửa hàng board game</span>
      </a>
      <a routerLink="/gio-hang" (click)="toggleMobileMenu()" class="drawer-link flex items-center gap-3">
        <app-morph-icon name="cart" [size]="18" color="#38bdf8"></app-morph-icon>
        <span>Giỏ hàng & Thanh toán</span>
      </a>
    </nav>
  }

  <!-- Main Content View Area -->
  <main id="main" tabindex="-1" class="main-content">
    <router-outlet />
    <footer class="legal-footer" aria-label="Thông tin website">
      <a routerLink="/chinh-sach-quyen-rieng-tu">Chính sách quyền riêng tư</a>
      <a routerLink="/dieu-khoan-su-dung">Điều khoản sử dụng</a>
      <a href="mailto:dothanh2572005@gmail.com">Liên hệ hỗ trợ</a>
    </footer>
  </main>
</div>
