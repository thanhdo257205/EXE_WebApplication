name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  release:
    name: Select successful main CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
      sha: ${{ steps.select.outputs.sha }}
      run_id: ${{ steps.select.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/select-release.mjs

  deploy:
    name: Deploy tested commit
    needs: release
    if: needs.release.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    env:
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cloudflare-proxy/package-lock.json
      - name: Download website built by the successful CI run
        uses: actions/download-artifact@v8.0.2
        with:
          name: angular-static-site
          path: release-site
          run-id: ${{ needs.release.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: npm ci
        working-directory: cloudflare-proxy
      - name: Deploy gateway (existing Worker secrets are retained)
        working-directory: cloudflare-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Deploy exact tested backend commit and await readiness
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: node .github/scripts/deploy-backend.mjs
      - name: Publish tested static artifact
        working-directory: cloudflare-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: ../cloudflare-proxy/node_modules/.bin/wrangler pages deploy ../release-site --project-name "$PAGES_PROJECT" --branch main --commit-hash "$RELEASE_SHA"
      - name: Production smoke checks
        env:
          BACKEND_ORIGIN: https://exe-web-backend.onrender.com
        run: node .github/scripts/smoke.mjs
      - name: Record deployed release
        run: |
          echo "Deployed commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Website: $PUBLIC_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
