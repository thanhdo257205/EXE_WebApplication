name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NG_CLI_ANALYTICS: 'false'

jobs:
  gateway:
    name: Cloudflare gateway tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-proxy
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cloudflare-proxy/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify deployment release gate
        run: node --test ../.github/scripts/*.test.mjs
      - run: npm run build

  frontend:
    name: Angular tests and static build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm test -- --watch=false --reporters=junit --output-file=test-results/junit.xml
      - name: Production static build
        run: npm run build
      - name: Add Pages API service binding entrypoint
        run: node ../.github/scripts/prepare-pages.mjs dist/exe-web/browser
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: angular-test-results
          path: frontend/test-results/
          retention-days: 7
      - name: Upload static website
        uses: actions/upload-artifact@v7.0.2
        with:
          name: angular-static-site
          path: frontend/dist/exe-web/browser/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Spring Boot tests and JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify with Maven Wrapper
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: spring-test-results
          path: backend/target/surefire-reports/
          retention-days: 7
      - name: Upload executable JAR
        uses: actions/upload-artifact@v7.0.2
        with:
          name: spring-boot-jar
          path: backend/target/backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Backend Docker build and smoke test
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build Docker image
        run: docker build --tag exe-web-api:ci backend
      - name: Run container with a 512 MB memory limit
        run: |
          docker run --detach --name exe-web-api --memory=512m \
            --publish 127.0.0.1:8080:8080 \
            --env SPRING_PROFILES_ACTIVE=local exe-web-api:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /tmp/health.json; then
              cat /tmp/health.json
              curl --fail --silent http://127.0.0.1:8080/api/v1/info
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not become healthy within 120 seconds.'
          exit 1
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs exe-web-api || true
          docker rm --force exe-web-api || true
